# ARS CI for this fork.
#
# Deliberately a NEW file rather than an edit to the inherited workflows. The
# other 50 files under .github/workflows/ belong to upstream open-design, and
# editing them would turn each upstream sync into a merge conflict. They are
# disabled on this fork instead: upstream's ci.yml resolves its runners to
# `nexu-runners-small` (their ARC fleet), a label that does not exist in this
# org, so those jobs would sit queued forever rather than failing visibly.
#
# Runs on ubuntu-latest, NOT the self-hosted coolify-ars-01 runner, even though
# afrinexus uses that runner. This repository is public, and the runner lives on
# the Coolify host itself. Pointing a public repo's `pull_request` jobs at it
# would let anyone who opens a PR execute code on the box running Coolify, and
# the runner is persistent, so a poisoned cache would outlive the job. GitHub
# blocks this by default via the runner group's "Allow public repositories"
# setting; that default is worth keeping. Public repos get hosted minutes free,
# so there is nothing to gain by overriding it.
name: ARS CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ars-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the packageManager field (10.33.2 here —
      # note this repo is a major behind afrinexus, which is why the version is
      # not hardcoded anywhere in this file).
      - uses: pnpm/action-setup@v4

      # engines.node is "~24" in package.json. The runner is a throwaway VM, so
      # unlike afrinexus's self-hosted setup the pnpm store does need caching.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Recursive across packages/, apps/, tools/ and e2e, plus the scripts
      # tsconfig — see the `typecheck` script in package.json.
      - run: pnpm run typecheck
